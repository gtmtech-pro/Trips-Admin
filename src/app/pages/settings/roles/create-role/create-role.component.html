<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Role" [breadcrumbItems]="BreadCrumbItems"></app-breadcrumbs>

<div class="row" id="role">
    <div class="col-lg-12">
        <div class="card">
            <form name="roleForm" [formGroup]="roleForm" class="role w-100-p" autocomplete="off"
                (ngSubmit)="saveOrUpdateRoleDetails()">
                <div class="card-header">
                    <div class="row g-4 align-items-center">
                        <div class="col-sm">
                            <div class="d-flex align-items-center">
                                <a class="back-trans-action" [routerLink]="'/settings/roles'">
                                    <img src="assets/images/back.png" height="30" />
                                </a>
                                <h5 class="card-title mb-0">
                                    {{ this.PageRights.ActionType | titlecase }} Role
                                </h5>
                            </div>
                        </div>
                        <div class="col-sm-auto">
                            <div class="d-flex gap-2" *ngIf="PageRights.ActionType !='view'">
                                <button type="submit" class="btn btn-success add-btn" id="create-btn">
                                    <i class="ri-add-line align-bottom me-1"></i>
                                    {{ this.PageRights.ActionType == 'new'? 'Save' : 'Update' }}
                                </button>
                                <button type="button" class="btn btn-info" [routerLink]="'/settings/roles'">
                                    <i class="ri-file-download-line align-bottom me-1"></i>
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row g-4">

                        <div class="col-lg-6">
                            <label class="form-label" for="code">
                                Code<span class="text-danger">*</span>
                            </label>
                            <input id="code" name="code" formControlName="Code" class="form-control" required
                                maxlength="15" [ngClass]="{'is-invalid': isInvalidControl(form['Code'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Code'])">
                                {{getErrorMessage(roleForm, 'Code')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="name">
                                Name<span class="text-danger">*</span>
                            </label>
                            <input id="name" name="name" formControlName="Name" class="form-control" required
                                maxlength="50" [ngClass]="{'is-invalid': isInvalidControl(form['Name'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Name'])">
                                {{getErrorMessage(roleForm, 'Name')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="description">
                                Description
                            </label>
                            <input id="description" name="description" formControlName="Description"
                                class="form-control" maxlength="350"
                                [ngClass]="{'is-invalid': isInvalidControl(form['Description'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Description'])">
                                {{getErrorMessage(roleForm, 'Description')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="landingPageUrl">
                                Landing Page Url
                            </label>
                            <input id="landingPageUrl" name="landingPageUrl" formControlName="LandingPageUrl"
                                class="form-control" maxlength="100"
                                [ngClass]="{'is-invalid': isInvalidControl(form['LandingPageUrl'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['LandingPageUrl'])">
                                {{getErrorMessage(roleForm, 'LandingPageUrl')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="remarks">
                                Remarks
                            </label>
                            <input id="remarks" name="remarks" formControlName="Remarks" class="form-control"
                                maxlength="350" [ngClass]="{'is-invalid': isInvalidControl(form['Remarks'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Remarks'])">
                                {{getErrorMessage(roleForm, 'Remarks')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-check-label" for="isActive">
                                Is Active?
                            </label>
                            <input type="checkbox" id="isActive" name="isActive" formControlName="IsActive"
                                class="form-check-input">
                        </div>

                    </div>
                </div>

                <div id="elmLoader">
                    <div class="spinner-border text-primary avatar-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
