<!-- Start Breadcrumbs -->
<app-breadcrumbs title="Data Type" [breadcrumbItems]="BreadCrumbItems"></app-breadcrumbs>

<div class="row" id="data-type">
    <div class="col-lg-12">
        <div class="card">
            <form name="dataTypeForm" [formGroup]="dataTypeForm" class="dataType w-100-p" autocomplete="off"
                (ngSubmit)="saveOrUpdateDataTypeDetails()">
                <div class="card-header">
                    <div class="row g-4 align-items-center">
                        <div class="col-sm">
                            <div class="d-flex align-items-center">
                                <a class="back-trans-action" [routerLink]="'/masters/data-types'">
                                    <img src="assets/images/back.png" height="30" />
                                </a>
                                <h5 class="card-title mb-0">
                                    {{ this.PageRights.ActionType | titlecase }} Data Type
                                </h5>
                            </div>
                        </div>
                        <div class="col-sm-auto">
                            <div class="d-flex gap-2" *ngIf="PageRights.ActionType !='view'">
                                <button type="submit" class="btn btn-success add-btn" id="create-btn">
                                    <i class="ri-add-line align-bottom me-1"></i>
                                    {{ this.PageRights.ActionType == 'new'? 'Save' : 'Update' }}
                                </button>
                                <button type="button" class="btn btn-info" [routerLink]="'/masters/data-types'">
                                    <i class="ri-file-download-line align-bottom me-1"></i>
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row g-4">
                        <div class="col-lg-6">
                            <label class="form-label" for="dataTypeId">
                                Data Type Id<span class="text-danger">*</span>
                            </label>
                            <input id="dataTypeId" name="dataTypeId" formControlName="DataTypeId" class="form-control"
                                required maxlength="10"
                                [ngClass]="{'is-invalid': isInvalidControl(form['DataTypeId'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['DataTypeId'])">
                                {{getErrorMessage(dataTypeForm, 'DataTypeId')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="name">
                                Name<span class="text-danger">*</span>
                            </label>
                            <input id="name" name="name" formControlName="Name" class="form-control" required
                                maxlength="50" [ngClass]="{'is-invalid': isInvalidControl(form['Name'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Name'])">
                                {{getErrorMessage(dataTypeForm, 'Name')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-label" for="description">
                                Description<span class="text-danger">*</span>
                            </label>
                            <input id="description" name="description" formControlName="Description"
                                class="form-control" required maxlength="350"
                                [ngClass]="{'is-invalid': isInvalidControl(form['Description'])}">
                            <div class="invalid-feedback" *ngIf="isShowErrors(form['Description'])">
                                {{getErrorMessage(dataTypeForm, 'Description')}}
                            </div>
                        </div>

                        <div class="col-lg-6">
                            <label class="form-check-label" for="isActive">
                                Is Active?
                            </label>
                            <input type="checkbox" id="isActive" name="isActive" formControlName="IsActive"
                                class="form-check-input">
                        </div>

                    </div>
                </div>

                <div id="elmLoader">
                    <div class="spinner-border text-primary avatar-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
